        <style>
    body{
        background-color: black;

    }
           .nav1 {
  width: 100%;               
  background-color:transparent;   
  text-align: right;
  padding: 15px;

  gap: 20px;

  top: 0;
  left: 0;
  z-index: 1000;
  margin: 0;                 
}

       
        .nav1 a {
  text-decoration: none;
  color: white;
  font-family: cursive;
  padding: 10px 15px;
  border-radius: 8px;
  transition: 0.3s;
}


.nav1 a:hover {
  color: black;
  background-color: yellow;
  height: fit-content;
}


.nav1 a.active {
  background-color: yellow;
  color: black;
  height: fit-content;
}


          
        
        
        .logo img{
          height: 80px;

        }
                

    
    .form-container h1{
        text-align: center;
        font-size: 60px;
        font-family: cursive;
           opacity: 0;
    transform: scale(0.5);
    animation: popIn 2s ease-out forwards;
    font-size: 100pxpx;
    text-align: center;
    margin-top: 100px;
    color: yellow;
    text-shadow: -20px -20px 60px yellow;
    }
 .form-container h5{
    font-size: 60px;
    text-align: center ;
    color: yellow;
    font-weight: 400;
    font-family: cursive;
    opacity: 0;
    transform: scale(0.5);
    animation: popIn 2s ease-out forwards;
    font-size: 100pxpx;
    text-align: center;
    margin-top: 100px;
    text-shadow: -20px -20px 60px yellow;
 }
 @keyframes popIn{
     to {
        opacity: 1;
        transform: scale(1);
     }

 }

  .video-background {
  position: relative;
  height:fit-content;
  overflow: hidden;
}

.video-background video {
  position:fixed;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  transform: translate(-50%, -50%);
  z-index: -1;
  object-fit:fill;
}
.order-button{
  text-align: center;
}

button{
  background-color:white;
  padding:20px;
  font-family: cursive;
 transition: all 0.3s ease; /* smooth animation */
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); /* normal shadow */
  border-radius: 7px;
  cursor:auto;
  background-color: yellow;
  
}

button:hover{
  transform: translateY(-25px) scale(1.30); 
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); 
  }

  footer{
    border: 1px;
    background-color: black;

    height: 0.5px;

 </style>

    <script>
  const navLinks = document.querySelectorAll(".nav1 a");

  navLinks.forEach(link => {
    link.addEventListener("click", function() {
      // Remove 'active' from all links
      navLinks.forEach(l => l.classList.remove("active"));
      
      // Add 'active' to the clicked one
      this.classList.add("active");
    });
  });
</script>
